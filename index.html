<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100f0d">
  <meta name="description" content="A magical ten-wheel stone combination lock.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Stone Lock">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Combination Lock</title>
  <style>
    :root {
      color-scheme: dark;
      --gold: #d3b77b;
      --gold-bright: #f0d99c;
      --ink: #100f0d;
      --muted: #aaa18e;
      --stone: #29251f;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      color: #eee8d8;
      background: #080807 url("./temple_of_cyric_lock5.png") center / contain no-repeat;
      font-family: Georgia, "Times New Roman", serif;
    }

    button {
      font: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
    }

    .topbar {
      position: absolute;
      z-index: 4;
      top: calc(14px + env(safe-area-inset-top, 0px));
      right: calc(18px + env(safe-area-inset-right, 0px));
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sound-toggle, .fullscreen-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid rgba(192, 170, 127, .34);
      border-radius: 2px;
      color: #d3c7ac;
      background: rgba(8, 8, 7, .6);
      cursor: pointer;
      font: 10px/1 "Palatino Linotype", Georgia, serif;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .fullscreen-toggle[hidden] { display: none; }

    .sound-toggle:hover, .sound-toggle:focus-visible,
    .fullscreen-toggle:hover, .fullscreen-toggle:focus-visible { color: var(--gold-bright); }
    .sound-icon { font-size: 15px; letter-spacing: 0; }

    .lock {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .wheels-set {
      position: absolute;
      pointer-events: auto;
      transform: translateY(-50%);
    }

    .left-set .wheel:nth-child(1) { --glyph-offset-x: calc(-.8mm * var(--image-scale)); }
    .left-set .wheel:nth-child(2) { --glyph-offset-x: calc(-1.2mm * var(--image-scale)); }
    .left-set .wheel:nth-child(3) { --glyph-offset-x: calc(-2mm * var(--image-scale)); }
    .left-set .wheel:nth-child(4) { --glyph-offset-x: calc(-2.8mm * var(--image-scale)); }
    .left-set .wheel:nth-child(5) { --glyph-offset-x: calc(-3.2mm * var(--image-scale)); }
    .right-set .wheel:nth-child(1) { --glyph-offset-x: calc(2mm * var(--image-scale)); }
    .right-set .wheel:nth-child(2) { --glyph-offset-x: calc(1.5mm * var(--image-scale)); }
    .right-set .wheel:nth-child(3) { --glyph-offset-x: calc(1.2mm * var(--image-scale)); }
    .right-set .wheel:nth-child(4) { --glyph-offset-x: calc(.9mm * var(--image-scale)); }
    .right-set .wheel:nth-child(5) { --glyph-offset-x: calc(1.1mm * var(--image-scale)); }

    .wheels {
      display: grid;
      width: 100%;
      height: 100%;
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .wheel {
      display: grid;
      place-items: center;
    }

    .letter {
      position: relative;
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      padding: 0;
      overflow: visible;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .drum-shading {
      position: absolute;
      z-index: 0;
      top: calc(-55px * var(--image-scale));
      right: 8%;
      bottom: calc(-35px * var(--image-scale));
      left: 8%;
      border-radius: 10% / 10%;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, .14), rgba(0, 0, 0, .04) 18%, rgba(0, 0, 0, .015) 50%, rgba(0, 0, 0, .04) 82%, rgba(0, 0, 0, .14)),
        linear-gradient(180deg, rgba(0, 0, 0, .08), transparent 16%, transparent 82%, rgba(0, 0, 0, .12));
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, .12), inset 0 -2px 6px rgba(0, 0, 0, .14);
      pointer-events: none;
    }

    .wheel-window {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      overflow: hidden;
      clip-path: inset(0);
      perspective: calc(280px * var(--image-scale));
      perspective-origin: center;
      pointer-events: none;
    }

    .wheel-drum {
      position: absolute;
      inset: 0;
      transform: rotateX(0deg);
      transform-style: preserve-3d;
    }

    .wheel-face {
      position: absolute;
      inset: 0;
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      overflow: hidden;
      transform: rotateX(var(--face-angle)) translateZ(calc(127.5px * var(--image-scale)));
      transform-style: preserve-3d;
      backface-visibility: hidden;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, .38), rgba(145, 119, 81, .08) 27%, rgba(223, 199, 157, .12) 49%, rgba(0, 0, 0, .4)),
        repeating-linear-gradient(0deg, rgba(0, 0, 0, .07) 0 1px, transparent 1px 5px),
        linear-gradient(180deg, rgba(0, 0, 0, .18), transparent 25%, transparent 75%, rgba(0, 0, 0, .24));
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, .32), inset 0 -2px 6px rgba(0, 0, 0, .35);
    }

    .wheel-face::before {
      position: absolute;
      inset: 0;
      content: "";
      background: linear-gradient(90deg, rgba(0, 0, 0, .1), transparent 28%, rgba(238, 216, 177, .025) 52%, transparent 75%, rgba(0, 0, 0, .08));
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, .14), inset 0 -2px 5px rgba(0, 0, 0, .16);
      pointer-events: none;
    }

    .wheel-glyph {
      position: relative;
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      color: transparent;
      background-color: #625742;
      background-image:
        radial-gradient(ellipse at 25% 30%, rgba(205, 190, 160, .8), transparent 50%),
        radial-gradient(ellipse at 70% 58%, rgba(35, 31, 24, .72), transparent 39%),
        repeating-linear-gradient(124deg, rgba(235, 218, 182, .18) 0 1px, rgba(49, 42, 33, .16) 1px 2px, transparent 2px 5px),
        repeating-linear-gradient(23deg, rgba(189, 171, 139, .11) 0 1px, transparent 1px 4px),
        linear-gradient(155deg, #85765d, #51483a 55%, #76674f);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: clamp(10px, calc(40px * var(--image-scale)), 40px);
      font-weight: 700;
      line-height: 1;
      text-shadow: -1px -1px 1px rgba(0, 0, 0, .42), 1px 1px 0 rgba(218, 194, 153, .48), 0 1px 2px rgba(0, 0, 0, .58);
      transform: translateX(var(--glyph-offset-x, 0)) scaleX(.8);
      transition: filter 180ms ease-out, transform 180ms ease-out;
      backface-visibility: hidden;
    }

    .wheel-glyph::after {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      content: attr(data-letter);
      color: transparent;
      font: inherit;
      line-height: inherit;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: .62;
      pointer-events: none;
    }

    .wheel-glyph[data-crack="0"]::after {
      background-image:
        linear-gradient(124deg, transparent 0 45%, rgba(35, 29, 21, .76) 45.5% 46.3%, rgba(204, 182, 143, .46) 46.6% 47%, transparent 47.5%),
        linear-gradient(62deg, transparent 0 67%, rgba(35, 29, 21, .62) 67.5% 68.2%, transparent 68.7%);
    }

    .wheel-glyph[data-crack="1"]::after {
      background-image:
        linear-gradient(53deg, transparent 0 37%, rgba(35, 29, 21, .74) 37.5% 38.3%, rgba(204, 182, 143, .42) 38.6% 39%, transparent 39.5%),
        linear-gradient(138deg, transparent 0 71%, rgba(35, 29, 21, .6) 71.4% 72.1%, transparent 72.6%);
    }

    .wheel-glyph[data-crack="2"]::after {
      background-image:
        linear-gradient(137deg, transparent 0 56%, rgba(35, 29, 21, .76) 56.5% 57.4%, rgba(204, 182, 143, .46) 57.7% 58.1%, transparent 58.6%),
        linear-gradient(46deg, transparent 0 26%, rgba(35, 29, 21, .6) 26.4% 27.1%, transparent 27.6%);
    }

    .wheels-set.liquid-gold .wheel-glyph,
    .wheels-set.liquid-blood .wheel-glyph {
      color: transparent;
      background-color: #191713;
      background-position: bottom;
      background-repeat: no-repeat;
      background-size: 100% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glyph-fill 2.2s cubic-bezier(.42, 0, .58, 1) 320ms both;
    }

    .wheels-set.liquid-gold .wheel-glyph {
      background-color: transparent;
      background-image: none;
      animation: none;
      text-shadow: none;
    }

    .wheels-set.liquid-gold .wheel-glyph::before {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      content: attr(data-letter);
      color: transparent;
      font: inherit;
      line-height: inherit;
      text-shadow: 0 0 5px rgba(239, 242, 246, .4);
      background-image:
        radial-gradient(ellipse at 30% 68%, rgba(255, 255, 255, .9), transparent 42%),
        radial-gradient(ellipse at 70% 43%, rgba(220, 225, 230, .65), transparent 36%),
        radial-gradient(ellipse at 48% 20%, rgba(255, 255, 255, .7), transparent 33%),
        repeating-linear-gradient(110deg, transparent 0 5px, rgba(244, 247, 250, .16) 7px 9px, transparent 12px 18px);
      background-size: 150% 200%;
      background-position: 45% 100%;
      background-repeat: no-repeat;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation:
        glyph-fog-rise 1.9s cubic-bezier(.36, .1, .2, 1) 320ms both,
        glyph-fog-drift 2.2s ease-in-out 320ms infinite alternate;
      pointer-events: none;
    }

    .wheels-set.liquid-blood .wheel-glyph {
      background-image:
        radial-gradient(ellipse at 28% 22%, rgba(181, 69, 60, .32), transparent 46%),
        radial-gradient(ellipse at 70% 70%, rgba(20, 3, 7, .48), transparent 50%),
        repeating-linear-gradient(124deg, rgba(220, 125, 104, .09) 0 1px, rgba(28, 5, 8, .1) 1px 3px, transparent 3px 6px),
        linear-gradient(to bottom, #8c2c30, #5b111a 37%, #28070b);
      text-shadow: 0 0 5px rgba(104, 10, 19, .44), 0 1px 2px rgba(15, 2, 4, .65);
    }

    @keyframes glyph-fog-rise {
      from { clip-path: inset(100% 0 0); opacity: .2; }
      to { clip-path: inset(0); opacity: .75; }
    }

    @keyframes glyph-fog-drift {
      from { background-position: 45% 100%; }
      to { background-position: 55% 0%; }
    }

    @keyframes glyph-fill {
      from { background-size: 100% 0%; }
      to { background-size: 100% 100%; }
    }

    .letter.rolling .wheel-drum {
      animation: drum-roll 640ms cubic-bezier(.25, .7, .25, 1) forwards;
      will-change: transform;
    }

    @keyframes drum-roll {
      from { transform: rotateX(0deg); }
      to { transform: rotateX(72deg); }
    }

    .letter:hover:not(.rolling) .wheel-glyph { filter: brightness(1.08); }
    .letter:focus-visible, .action:focus-visible,
    .sound-toggle:focus-visible, .fullscreen-toggle:focus-visible {
      outline: 1px solid var(--gold-bright);
      outline-offset: 3px;
    }

    .controls {
      position: absolute;
      z-index: 4;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      display: flex;
      pointer-events: auto;
      transform: translateX(-50%);
    }

    .action {
      padding: 7px 10px;
      border: 0;
      color: rgba(222, 211, 186, .42);
      background: transparent;
      cursor: pointer;
      font: 10px/1 "Palatino Linotype", Georgia, serif;
      letter-spacing: .14em;
      text-transform: uppercase;
      transition: color .2s ease, opacity .2s ease;
      opacity: .62;
    }

    .action:hover, .action:focus-visible { color: #f6e5bb; opacity: 1; }

    .sparkles {
      position: fixed;
      z-index: 5;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .unlocked .wheel-glyph {
      color: #17140f;
      text-shadow: -1px -1px 1px rgba(0, 0, 0, .95), 1px 1px 0 rgba(255, 232, 181, .66), 0 0 8px rgba(240, 217, 156, .45);
    }

    @media (max-width: 620px) {
      .topbar {
        top: calc(8px + env(safe-area-inset-top, 0px));
        right: calc(8px + env(safe-area-inset-right, 0px));
      }
      .sound-toggle, .fullscreen-toggle { padding: 6px 8px; font-size: 8px; }
      .controls { bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
      .action { font-size: 8px; }
      .wheel-glyph { font-size: clamp(10px, calc(40px * var(--image-scale)), 22px); }
    }

    @media (pointer: coarse) {
      .sound-toggle, .fullscreen-toggle { min-height: 44px; }
      .action { min-height: 44px; padding: 12px 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <canvas class="sparkles" aria-hidden="true"></canvas>
  <div class="page">
    <header class="topbar">
      <button class="fullscreen-toggle" type="button" aria-label="Enter fullscreen" title="Browsers require a click to enter fullscreen.">Fullscreen</button>
      <button class="sound-toggle" type="button" aria-pressed="true" aria-label="Disable stone sounds">
        <span class="sound-icon" aria-hidden="true">♫</span><span class="sound-label">Sound on</span>
      </button>
    </header>

    <main class="lock" aria-label="Ten-wheel combination lock">
      <div class="wheels-set left-set" aria-label="Left five wheels">
        <div class="wheels" data-side="left"></div>
      </div>
      <div class="wheels-set right-set" aria-label="Right five wheels">
        <div class="wheels" data-side="right"></div>
      </div>
      <div class="controls">
        <button class="action" type="button" data-action="reset">Reset</button>
      </div>
    </main>
  </div>

  <script>
    (() => {
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const words = {
        left: ["LEIRA", "CYRIC", "STERF", "VREES", "HOOPT"],
        right: ["LEEFT", "LIEGT", "LEIRA", "CYRIC", "TRAAN"]
      };
      const fillerLetters = {
        left: [[], [], ["A"], ["H"], []],
        right: [["E", "I"], ["A"], ["T"], [], ["E"]]
      };
      const rings = Object.fromEntries(Object.entries(words).map(([side, sideWords]) => [
        side,
        Array.from({ length: 5 }, (_, index) => {
          const letters = [...new Set(sideWords.map(word => word[index]))];
          for (const filler of fillerLetters[side][index]) {
            if (letters.length < 5 && !letters.includes(filler)) letters.push(filler);
          }
          while (letters.length < 5) {
            const filler = [...alphabet].find(letter =>
              letter !== "M" && letter !== "W" && !letters.includes(letter)
            );
            letters.push(filler);
          }
          return letters;
        })
      ]));
      for (const [side, sideWords] of Object.entries(words)) {
        for (const word of sideWords) {
          if ([...word].some((letter, index) => !rings[side][index]?.includes(letter))) {
            throw new Error(`The ${side} wheel letters cannot form ${word}`);
          }
        }
      }
      const soundToggle = document.querySelector(".sound-toggle");
      const soundLabel = document.querySelector(".sound-label");
      const fullscreenToggle = document.querySelector(".fullscreen-toggle");
      const canvas = document.querySelector(".sparkles");
      const ctx = canvas.getContext("2d");
      let soundEnabled = true;
      const soundFiles = {
        blood: "./Cyric.mp3",
        fog: "./Leira.mp3",
        turn: "./Turn.mp3",
        lightning: "./lightning_Crackle.mp3",
        unlock: "./Opened.mp3"
      };
      const soundTemplates = Object.fromEntries(Object.entries(soundFiles).map(([name, source]) => {
        const audio = new Audio(source);
        audio.preload = "auto";
        return [name, audio];
      }));
      const activeLiquidSounds = new Set();
      let unlocked = false;
      let particles = [];
      let width = 0;
      let height = 0;
      let turnGeneration = 0;
      let resolutionTimer;
      let resolving = false;
      let lightningStartedAt = 0;
      let lightningBolts = [];
      const rolling = new Set();
      const liquidWords = {
        left: { LEIRA: "gold", CYRIC: "blood" },
        right: { LEEFT: "gold", LIEGT: "blood" }
      };
      const initialWords = { left: "HYEPS", right: "TIRGN" };
      const positionsForWord = (side, word) =>
        [...word].map((letter, index) => rings[side][index].indexOf(letter));
      const initialPositions = {
        left: positionsForWord("left", initialWords.left),
        right: positionsForWord("right", initialWords.right)
      };
      if (Object.values(initialPositions).some(sidePositions => sidePositions.some(position => position < 0))) {
        throw new Error("The configured starting words do not fit the wheel letters");
      }
      const matchingLetters = (word, target) =>
        [...word].filter((letter, index) => letter === target[index]).length;
      const startingAlignmentCounts = {
        left: ["LEIRA", "CYRIC"].map(target => matchingLetters(initialWords.left, target)),
        right: ["LEEFT", "LIEGT"].map(target => matchingLetters(initialWords.right, target))
      };
      if (["C", "L"].includes(initialWords.left[0])
        || initialWords.right[0] === "L"
        || startingAlignmentCounts.left.some(matches => matches > 1)
        || startingAlignmentCounts.right.some(matches => matches > 2)) {
        throw new Error("The configured starting words violate the per-side alignment limits");
      }
      let positions = { left: [...initialPositions.left], right: [...initialPositions.right] };

      function wordAt(side) {
        return positions[side].map((choice, index) => rings[side][index][choice]).join("");
      }

      function isSolved() {
        return wordAt("left") === "LEIRA" && wordAt("right") === "LEEFT";
      }

      function updateLiquidEffects() {
        for (const side of ["left", "right"]) {
          const set = document.querySelector(`.${side}-set`);
          const liquid = liquidWords[side][wordAt(side)];
          const previousLiquid = set.classList.contains("liquid-gold")
            ? "gold"
            : set.classList.contains("liquid-blood") ? "blood" : null;
          set.classList.toggle("liquid-gold", liquid === "gold");
          set.classList.toggle("liquid-blood", liquid === "blood");
          if (liquid && liquid !== previousLiquid && !resolving && !unlocked) {
            playSound(liquid === "gold" ? "fog" : "blood", true);
          }
        }
      }

      function setGlyph(glyph, letter, wheelIndex) {
        glyph.textContent = letter;
        glyph.dataset.letter = letter;
        glyph.dataset.crack = String((letter.charCodeAt(0) + wheelIndex) % 3);
      }

      function positionWheels() {
        const scale = Math.min(window.innerWidth / 1536, window.innerHeight / 1024);
        const imageWidth = 1536 * scale;
        const imageHeight = 1024 * scale;
        const offsetX = (window.innerWidth - imageWidth) / 2;
        const offsetY = (window.innerHeight - imageHeight) / 2;
        document.documentElement.style.setProperty("--image-scale", scale);

        [
          [".left-set", 208, 476, 510, 120],
          [".right-set", 818, 476, 510, 120]
        ].forEach(([selector, x, y, setWidth, setHeight]) => {
          const set = document.querySelector(selector);
          set.style.left = `${offsetX + x * scale}px`;
          set.style.top = `${offsetY + (y + setHeight / 2) * scale}px`;
          set.style.width = `${setWidth * scale}px`;
          set.style.height = `${setHeight * scale}px`;
        });
      }

      function renderWheels() {
        document.querySelectorAll(".wheels").forEach(set => {
          const side = set.dataset.side;
          set.replaceChildren();
          positions[side].forEach((choice, index) => {
            const wheel = document.createElement("div");
            wheel.className = "wheel";

            const face = document.createElement("button");
            face.className = "letter";
            face.type = "button";
            face.setAttribute("aria-label", `${side} wheel ${index + 1}: ${rings[side][index][choice]}`);
            const window = document.createElement("span");
            window.className = "wheel-window";
            const drum = document.createElement("span");
            drum.className = "wheel-drum";
            rings[side][index].forEach((_, offset) => {
              const panel = document.createElement("span");
              panel.className = "wheel-face";
              panel.style.setProperty("--face-angle", `${-offset * 72}deg`);
              const glyph = document.createElement("span");
              glyph.className = "wheel-glyph";
              setGlyph(glyph, rings[side][index][(choice + offset) % rings[side][index].length], index);
              panel.append(glyph);
              drum.append(panel);
            });
            window.append(drum);
            face.append(window);
            const shading = document.createElement("span");
            shading.className = "drum-shading";
            shading.setAttribute("aria-hidden", "true");
            face.append(shading);
            face.addEventListener("click", () => turn(side, index, face));

            wheel.append(face);
            set.append(wheel);
          });
        });
      }

      function turn(side, index, face) {
        const key = `${side}:${index}`;
        if (unlocked || resolving || rolling.has(key)) return;

        const ring = rings[side][index];
        const nextPosition = (positions[side][index] + 1) % ring.length;
        const drum = face.querySelector(".wheel-drum");
        const generation = turnGeneration;
        let finished = false;
        let fallback;
        rolling.add(key);

        function finish(event) {
          if (event && (event.target !== drum || event.animationName !== "drum-roll")) return;
          if (finished || generation !== turnGeneration) return;
          finished = true;
          clearTimeout(fallback);
          drum.removeEventListener("animationend", finish);
          rolling.delete(key);
          positions[side][index] = nextPosition;
          [...drum.children].forEach((panel, offset) => {
            setGlyph(panel.querySelector(".wheel-glyph"), ring[(nextPosition + offset) % ring.length], index);
          });
          face.classList.remove("rolling");
          face.setAttribute("aria-label", `${side} wheel ${index + 1}: ${ring[nextPosition]}`);
          resolveCombination();
          updateLiquidEffects();
        }

        drum.addEventListener("animationend", finish);
        face.classList.add("rolling");
        function finishWhenVisible() {
          if (generation !== turnGeneration) return;
          if (document.visibilityState === "hidden") {
            fallback = setTimeout(finishWhenVisible, 600);
            return;
          }
          finish();
        }

        fallback = setTimeout(finishWhenVisible, 850);
        playSound("turn");
      }

      function playSound(name, isLiquid = false) {
        if (!soundEnabled) return;
        const audio = soundTemplates[name].cloneNode();
        audio.preload = "auto";
        if (name === "turn") audio.volume = .5;
        if (isLiquid) {
          activeLiquidSounds.add(audio);
          audio.addEventListener("ended", () => activeLiquidSounds.delete(audio), { once: true });
        }
        const playback = audio.play();
        if (playback && typeof playback.catch === "function") {
          playback.catch(error => {
            activeLiquidSounds.delete(audio);
            console.error(`Unable to play ${soundFiles[name]}`, error);
          });
        }
      }

      function silenceLiquidSounds() {
        for (const audio of activeLiquidSounds) audio.pause();
        activeLiquidSounds.clear();
      }

      function resizeCanvas() {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * ratio;
        canvas.height = height * ratio;
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function burst() {
        for (let i = 0; i < 150; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1 + Math.random() * 4.5;
          particles.push({
            x: width / 2 + (Math.random() - .5) * 260,
            y: height / 2 + (Math.random() - .5) * 90,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1,
            life: 45 + Math.random() * 55,
            size: .8 + Math.random() * 2.2
          });
        }
      }

      function animateParticles() {
        ctx.clearRect(0, 0, width, height);
        particles = particles.filter(p => p.life > 0);
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += .025;
          p.life--;
          ctx.globalAlpha = Math.min(1, p.life / 30) * .85;
          ctx.fillStyle = Math.random() > .84 ? "#fff0bc" : "#c8a75d";
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        drawLightning(performance.now());
        requestAnimationFrame(animateParticles);
      }

      function makeBolt(startX, startY, endX, endY, segmentCount, spread) {
        const points = [[startX, startY]];
        for (let i = 1; i < segmentCount; i++) {
          const progress = i / segmentCount;
          points.push([
            startX + (endX - startX) * progress + (Math.random() - .5) * spread,
            startY + (endY - startY) * progress + (Math.random() - .5) * spread
          ]);
        }
        points.push([endX, endY]);
        return points;
      }

      function triggerLightning() {
        silenceLiquidSounds();
        playSound("lightning");
        lightningStartedAt = performance.now();
        const centerX = width / 2;
        const centerY = height / 2;
        const spanX = Math.min(width * .68, 900);
        const spanY = Math.min(height * .42, 380);
        lightningBolts = [
          makeBolt(centerX - spanX / 2, centerY - spanY * .25, centerX + spanX / 2, centerY + spanY * .2, 15, spanY * .28),
          makeBolt(centerX - spanX * .34, centerY + spanY * .36, centerX + spanX * .38, centerY - spanY * .32, 13, spanY * .24),
          makeBolt(centerX - spanX * .12, centerY - spanY * .48, centerX + spanX * .18, centerY + spanY * .48, 11, spanY * .2)
        ];
      }

      function drawLightning(now) {
        if (!lightningStartedAt) return;
        const elapsed = now - lightningStartedAt;
        if (elapsed >= 900) {
          lightningStartedAt = 0;
          lightningBolts = [];
          return;
        }
        const flashPhase = elapsed % 170;
        if (flashPhase > 66) return;

        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = (1 - elapsed / 900) * (flashPhase < 28 ? 1 : .65);
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.shadowColor = "#70d9ff";
        ctx.shadowBlur = 24;
        ctx.strokeStyle = "#75dfff";
        ctx.lineWidth = 5;
        for (const points of lightningBolts) {
          ctx.beginPath();
          points.forEach(([x, y], index) => {
            if (index === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          ctx.stroke();
        }
        ctx.shadowBlur = 8;
        ctx.strokeStyle = "#f3fcff";
        ctx.lineWidth = 1.5;
        for (const points of lightningBolts) {
          ctx.beginPath();
          points.forEach(([x, y], index) => {
            if (index === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          ctx.stroke();
        }
        ctx.restore();
      }

      function resolveCombination() {
        if (unlocked || resolving) return;
        const leftWord = wordAt("left");
        const rightWord = wordAt("right");

        if (isSolved()) {
          openLock();
          return;
        }
        if ((leftWord === "CYRIC" && (rightWord === "LIEGT" || rightWord === "LEEFT"))
          || (leftWord === "LEIRA" && rightWord === "LIEGT")) {
          resolving = true;
          triggerLightning();
          resolutionTimer = setTimeout(reset, 2800);
        }
      }

      function openLock() {
        if (unlocked) return;
        unlocked = true;
        silenceLiquidSounds();
        document.body.classList.add("unlocked");
        burst();
        setTimeout(burst, 240);
        playSound("unlock");
      }

      function reset() {
        clearTimeout(resolutionTimer);
        resolutionTimer = undefined;
        turnGeneration++;
        rolling.clear();
        resolving = false;
        lightningStartedAt = 0;
        lightningBolts = [];
        particles = [];
        positions = { left: [...initialPositions.left], right: [...initialPositions.right] };
        unlocked = false;
        document.body.classList.remove("unlocked");
        renderWheels();
        updateLiquidEffects();
      }

      document.querySelector('[data-action="reset"]').addEventListener("click", reset);

      soundToggle.addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        soundToggle.setAttribute("aria-pressed", String(soundEnabled));
        soundToggle.setAttribute("aria-label", soundEnabled ? "Disable stone sounds" : "Enable stone sounds");
        soundLabel.textContent = soundEnabled ? "Sound on" : "Sound off";
      });

      if (!document.fullscreenEnabled || typeof document.documentElement.requestFullscreen !== "function") {
        fullscreenToggle.hidden = true;
      } else {
        fullscreenToggle.addEventListener("click", async () => {
          try {
            if (document.fullscreenElement) await document.exitFullscreen();
            else await document.documentElement.requestFullscreen();
          } catch (error) {
            console.error("Could not change fullscreen mode", error);
          }
        });
        document.addEventListener("fullscreenchange", () => {
          const isFullscreen = Boolean(document.fullscreenElement);
          fullscreenToggle.textContent = isFullscreen ? "Exit fullscreen" : "Fullscreen";
          fullscreenToggle.setAttribute("aria-label", isFullscreen ? "Exit fullscreen" : "Enter fullscreen");
        });
      }

      window.addEventListener("resize", () => {
        resizeCanvas();
        positionWheels();
      });
      if ("serviceWorker" in navigator && location.protocol !== "file:") {
        navigator.serviceWorker.register("./sw.js").catch(error => {
          console.error("Service worker registration failed", error);
        });
      }
      resizeCanvas();
      positionWheels();
      renderWheels();
      animateParticles();
    })();
  </script>
</body>
</html>
